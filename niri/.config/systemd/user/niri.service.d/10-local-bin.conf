# niri-session starts niri through the zsh login shell and imports that shell's
# environment, whose PATH lacks ~/.local/bin (zsh adds it in .zshrc, interactive only).
# Set PATH on the service itself so niri binds can launch per-user installs (Zed,
# Strata). Environment= overrides the imported value. Takes effect at the next login.
[Service]
Environment=PATH=%h/.local/bin:/usr/local/bin:/usr/bin

# Lock screen for the hypr-omarchy session, in the gruvbox-hard-seeds colours.
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(29, 32, 33, 1.0)
    blur_passes = 0
}

label {
    monitor =
    text = $TIME
    color = rgba(212, 190, 152, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    outer_color = rgba(125, 174, 163, 1.0)
    inner_color = rgba(29, 32, 33, 1.0)
    font_color = rgba(212, 190, 152, 1.0)
    check_color = rgba(216, 166, 87, 1.0)
    fail_color = rgba(234, 105, 98, 1.0)
    placeholder_text = Password
    fade_on_empty = false
    rounding = 0
    position = 0, -20
    halign = center
    valign = center
}
